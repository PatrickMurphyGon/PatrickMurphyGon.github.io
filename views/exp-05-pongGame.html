<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exp 05 - Pong</title>
  <link rel="stylesheet" href="../style/style.css">
  <link rel="stylesheet" href="../style/style-pong.css">

  <!-- MAPA DE IMPORTACIONES OBLIGATORIO PARA THREE.JS -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body>

  <!-- Volver al inicio -->
  <a href="../index.html" class="btn-back" title="Volver al inicio" aria-label="Volver al inicio">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
  </a>

  <!-- Canvas WebGL -->
  <canvas id="webgl"></canvas>

  <!-- UI del Juego -->
  <div id="ui-pong">
    <div id="scoreboard"><span id="score-left">0</span> : <span id="score-right">0</span></div>
    <button id="btn-start" class="btn-neon">INICIAR JUEGO</button>

    <div id="winner-modal" class="hidden">
      <h1 id="winner-text" style="font-size: 2.5rem;">¡JUGADOR 1 GANA!</h1>
      <button id="btn-restart" class="btn-neon">JUGAR DE NUEVO</button>
    </div>
  </div>

  <!-- Mensaje de aviso para girar pantalla -->
  <div id="rotate-screen-modal">
    <div class="rotate-card">
      <div class="phone-animation">
        <div class="phone">
          <div class="phone-screen"></div>
        </div>
        <div class="rotate-arrow"></div>
      </div>
      <h2>MODO HORIZONTAL</h2>
      <p>Gira tu dispositivo para entrar a la arena neón</p>
    </div>
  </div>

  <!-- Script de la pruba -->
  <script type="module" src="../scripts/exps/exp-05-pong/game-logic.js"></script>
</body>
</html>
