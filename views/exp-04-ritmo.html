<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exp 04 - Partículas Reactivas al Audio</title>
    <link rel="stylesheet" href="../style/style.css">

    <!-- MAPA DE IMPORTACIONES -->
    <script type="importmap">
        {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
        }
        }
    </script>
    <style>
        .audio-controls {
            position: fixed;
            bottom: 1.5rem;
            left: 1.5rem;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.65rem;
            background: rgba(42, 29, 15, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0.85rem 1.1rem;
            border-radius: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            min-width: 310px;
        }

        .audio-controls .button-group {
            display: flex;
            gap: 0.5rem;
            width: 100%;
        }

        .btn-audio-action {
            padding: 0.55rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            background: #f89538;
            color: #0f172a;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .btn-audio-action:hover:not(:disabled) {
            background: #fcba7d;
            transform: translateY(-2px);
        }

        .btn-audio-action:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* 📻 ESTILOS PARA LA SECCIÓN DE RADIO ONLINE */
        .radio-container {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            align-items: center;
        }

        .radio-select {
            flex: 1;
            padding: 0.48rem 0.6rem;
            font-size: 0.8rem;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.4);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.75rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .radio-select:hover {
            border-color: #f89538;
        }

        .radio-select option {
            background: #2a1d0f;
            color: #f8fafc;
        }

        .btn-radio {
            background: #3b82f6;
            color: #ffffff;
            white-space: nowrap;
        }

        .btn-radio:hover:not(:disabled) {
            background: #60a5fa;
        }

        .btn-radio.active {
            background: #22c55e;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
        }

        #audio-status {
            font-size: 0.75rem;
            color: #cbd5e1;
            max-width: 280px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Slider de Volumen */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            margin-top: 0.2rem;
        }

        .volume-icon {
            font-size: 0.9rem;
        }

        #volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #f89538;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        #volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #fcba7d;
        }
    </style>
</head>

<body>

    <!-- Botón de regreso -->
    <a href="../index.html" class="btn-back">← Volver al inicio</a>

    <!-- Interfaz de Control de Audio -->
    <div class="audio-controls">
        <!-- Input invisible para abrir el explorador de archivos del PC -->
        <input type="file" id="audio-file-input" accept="audio/*" hidden />

        <!-- 📁 Fila 1: Carga de Archivo MP3 y Play general -->
        <div class="button-group">
            <button id="btn-upload" class="btn-audio-action">📁 Cargar MP3</button>
            <button id="btn-play" class="btn-audio-action" disabled>▶️ Play</button>
        </div>

        <!-- 📻 Fila 2: Selector y Conexión a Radio Online -->
        <div class="radio-container">
            <select id="radio-select" class="radio-select">
                <option value="" disabled selected>📻 Seleccionar Radio...</option>
                <option value="https://stream.zeno.fm/f3wvbbqmdg8uv">Lofi Hip Hop</option>
                <option value="https://stream.zeno.fm/0r0xa792kwzuv">Chill & Ambient</option>
                <option value="https://stream.electro-dance.net/stream">Electro & Dance</option>
                <option value="https://stream.zeno.fm/4vbe1421rwzuv">Synthwave / Retro</option>
                <option value="https://stream.zeno.fm/337q5v8362zuv">Jazz & Relax</option>
                <option value="https://playerservices.streamtheworld.com/api/livestream-redirect/LOS40_CLASSIC.mp3">LOS40 Classic</option>
            </select>
            <button id="btn-radio-toggle" class="btn-audio-action btn-radio">📻 Conectar Radio</button>
        </div>

        <!-- 🔊 Fila 3: Control de Volumen (Único para MP3 y Radio) -->
        <div class="volume-container">
            <span class="volume-icon">🔊</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" />
        </div>

        <span id="audio-status">Carga un MP3 o sintoniza una Radio</span>
    </div>

    <!-- Canvas 3D -->
    <canvas id="webgl"></canvas>

    <!-- Script principal del experimento -->
    <script type="module" src="../scripts/exps/exp-04-ritmo.js"></script>
</body>

</html>
